plugins { id 'com.android.application' }

android {
    namespace 'com.example.kardscustom'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.kardscustom'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

def cardArtOutput = file('src/main/assets/card-art')
tasks.register('unpackCardArt') {
    def imageNames = ['infantry', 'airstrike', 'medium', 'atgm', 'scout', 'heavy', 'engineer', 'reinforcements', 'medkit', 'artillery']
    def sourceFiles = imageNames.collect { file("src/main/assets/card-art-data/${it}.txt") }
    inputs.files(sourceFiles)
    outputs.dir(cardArtOutput)
    doLast {
        cardArtOutput.mkdirs()
        imageNames.each { name ->
            def sourceFile = file("src/main/assets/card-art-data/${name}.txt")
            if (!sourceFile.exists()) throw new GradleException("Missing bundled card artwork: ${name}")
            try {
                def bytes = java.util.Base64.getDecoder().decode(sourceFile.getText('UTF-8').trim())
                new File(cardArtOutput, "${name}.jpg").bytes = bytes
            } catch (IllegalArgumentException error) {
                throw new GradleException("Invalid Base64 card image: ${name}", error)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('unpackCardArt') }
