plugins { id 'com.android.application' }

android {
    namespace 'com.example.kardscustom'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.kardscustom'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

def cardArtOutput = file('src/main/assets/card-art')
tasks.register('unpackCardArt') {
    def htmlFile = file('src/main/assets/index.html')
    inputs.file(htmlFile)
    outputs.dir(cardArtOutput)
    doLast {
        def source = htmlFile.getText('UTF-8')
        def dataStart = source.indexOf('const suppliedCardArtData=')
        def dataEnd = source.indexOf(';', dataStart)
        if (dataStart < 0 || dataEnd < 0) throw new GradleException('Bundled card artwork data was not found')
        def dataSource = source.substring(dataStart, dataEnd)
        def required = ['infantry', 'airstrike', 'medium', 'atgm', 'scout', 'heavy']
        def art = [:]
        required.each { name ->
            def marker = "\"${name}\":\""
            def valueStart = dataSource.indexOf(marker)
            if (valueStart < 0) throw new GradleException("Missing bundled card artwork: ${name}")
            valueStart += marker.length()
            def valueEnd = dataSource.indexOf('"', valueStart)
            if (valueEnd < 0) throw new GradleException("Unterminated bundled card artwork: ${name}")
            art[name] = dataSource.substring(valueStart, valueEnd)
        }
        cardArtOutput.mkdirs()
        art.each { name, encoded ->
            try {
                def bytes = java.util.Base64.getDecoder().decode(encoded)
                new File(cardArtOutput, "${name}.jpg").bytes = bytes
            } catch (IllegalArgumentException error) {
                throw new GradleException("Invalid Base64 card image: ${name}", error)
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('unpackCardArt') }
